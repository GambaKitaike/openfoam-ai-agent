[project]
name = "openfoam-ai-agent"
version = "0.1.0"
description = "OpenFOAMの解析ファイルを自動生成するAIエージェント"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.30.0",
    "anthropic>=0.28.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
]

[project.scripts]
openfoam-agent = "src.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"
