name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: pytest（LLM・OpenFOAM 不要テストのみ）
        env:
          OPENAI_API_KEY: sk-dummy-key-for-ci
          LLM_PROVIDER: openai
          LLM_MODEL: gpt-4o
        run: |
          pytest tests/ -v --tb=short

      - name: テスト結果サマリー
        if: always()
        run: |
          echo "## CI 結果" >> $GITHUB_STEP_SUMMARY
          echo "- Python: $(python --version)" >> $GITHUB_STEP_SUMMARY
